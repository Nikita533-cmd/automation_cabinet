version: '3'

services:
  automation_cabinet:
    build: ./automation_cabinet/
    # ports:
    #   - 8000:8000
    env_file: .env
    volumes:
      - ./automation_cabinet:/app
      - static_volume:/app/staticfiles
    command: gunicorn --reload automation_cabinet.wsgi:application -b 0.0.0.0:8000
  gateway:
    build: ./nginx/
    env_file: .env
    ports:
        - 8000:80
    volumes:
        - ./automation_cabinet/static:/static
        # - static_volume:/static
    depends_on:
        - automation_cabinet
  postgres:
    image: postgres:13
    env_file: .env
    volumes:
      - postgres-volume:/var/lib/postgresql/data
volumes:
  static_volume:
  postgres-volume: