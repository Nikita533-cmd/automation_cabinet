server {
  
  listen 80;
 
  # location /admin/ {
  #   proxy_set_header Host $host;
  #   proxy_set_header X-Real-IP $remote_addr;
  #   proxy_pass http://automation_cabinet:8000/admin/;
  # }

  # Media файлы
  location /media/ {
    alias /media/;
    expires 30d;
  }

  location /static/ {
    alias /static/;
    index index.html;
    try_files $uri $uri/ /index.html =403;
  }
  location / {
    proxy_pass http://automation_cabinet:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_redirect off;
    proxy_read_timeout 60s;    # ← добавить
    proxy_connect_timeout 60s;
    proxy_send_timeout 180s;
  }
}